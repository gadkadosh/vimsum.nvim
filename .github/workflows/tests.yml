name: Tests

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Nightly is an early warning, not a release compatibility gate.
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Prepare Plenary
        env:
          PLENARY_REV: 74b06c6c75e4eeb3108ec01852001636d85a932b
        run: |
          git init ../plenary.nvim
          git -C ../plenary.nvim fetch --depth 1 https://github.com/nvim-lua/plenary.nvim "$PLENARY_REV"
          git -C ../plenary.nvim checkout --detach FETCH_HEAD

      - name: Run tests
        run: |
          nvim --version
          make test
